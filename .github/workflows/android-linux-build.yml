name: Android Build (Linux host)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android runtime build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison build-essential bzip2 ca-certificates curl diffutils flex \
            gawk gzip patch pkg-config tar unzip xz-utils

      - name: Fetch Android runtime sources
        shell: pwsh
        run: pwsh -NoProfile -File tools/android-runtime/fetch_sources.ps1

      - name: Fetch Android NDK
        run: bash tools/android-runtime/fetch_ndk_wsl.sh

      - name: Build Android terminal runtime
        run: |
          export ANDROID_NDK_HOME="$HOME/.cache/operit-android-runtime/android-ndk-r29-beta4"
          bash tools/android-runtime/build_android_tools_wsl.sh
          bash tools/android-runtime/build_alpine_rootfs_wsl.sh

      - name: Upload Android terminal runtime
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-runtime-${{ github.sha }}
          path: |
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/libbash.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_busybox.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_loader.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_proot.so
            apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin
            apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin.sha256
          if-no-files-found: error
          retention-days: 1

  build-android:
    needs: build-android-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      RUSTFLAGS: -Awarnings
      RUST_TOOLCHAIN_VERSION: 1.95.0
      FVM_VERSION: 4.3.0
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android terminal runtime
        uses: actions/download-artifact@v4
        with:
          name: operit2-android-runtime-${{ github.sha }}
          path: apps/flutter/app/android/app/src/main

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang llvm libclang-dev lld cmake ninja-build pkg-config \
            python3-venv libgtk-3-dev libblkid-dev liblzma-dev

      - name: Resolve libclang for bindgen
        run: |
          LIBCLANG=$(ls -d /usr/lib/llvm-*/lib 2>/dev/null | tail -1)
          echo "LIBCLANG_PATH=$LIBCLANG" >> "$GITHUB_ENV"
          ls "$LIBCLANG"/libclang.so* || true

      - name: Install bootstrap Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install FVM
        run: |
          dart pub global activate fvm "$FVM_VERSION"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install project Flutter SDK
        working-directory: apps/flutter/app
        run: fvm install --skip-pub-get

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: aarch64-linux-android

      # fork patch: upstream never generates the gitignored ToolPkg assets that
      # operit-runtime's build.rs must embed, so every cargo check panics.
      - name: Prepare plugin assets (fork patch)
        run: |
          python3 -m venv .venv
          npm install --prefix .ci-tools/typescript --no-audit --no-fund typescript@5.9.3
          corepack enable pnpm
          corepack pnpm --version
          .venv/bin/python plugins/tools/sync_plugin_packages.py --source runtime --no-hot-reload

      - name: Restore Android signing material
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_RELEASE_KEYSTORE_BASE64 ANDROID_RELEASE_STORE_PASSWORD ANDROID_RELEASE_KEY_ALIAS ANDROID_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
          mkdir -p tools/release/secrets
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 -d > tools/release/secrets/operit2-release.keystore
          {
            echo "RELEASE_STORE_FILE=operit2-release.keystore"
            echo "RELEASE_STORE_PASSWORD=$ANDROID_RELEASE_STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$ANDROID_RELEASE_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$ANDROID_RELEASE_KEY_PASSWORD"
          } > tools/release/secrets/android-signing.properties

      - name: Cache source-built Android V8
        uses: actions/cache@v4
        with:
          path: tools/release/work/android-v8
          key: ${{ runner.os }}-${{ runner.arch }}-android-v8-${{ hashFiles('tools/build_scripts/prepare_android_v8.py', 'apps/flutter/native/operit-flutter-bridge/Cargo.lock') }}

      - name: Check build environment
        run: python3 tools/build_scripts/check_build_environment.py --products app --github-runner

      - name: Build and package Android app
        run: |
          set -euo pipefail
          line=$(grep -E '^version:' apps/flutter/app/pubspec.yaml | head -1)
          build_name=$(echo "$line" | sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+).*/\1/')
          build_number=$(echo "$line" | sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+).*/\2/')
          echo "building $build_name+$build_number"
          python3 tools/build_scripts/build_flutter_android.py --build-name "$build_name" --build-number "$build_number" --enforce-lockfile

      - name: Build and package Android module
        run: python3 tools/build_scripts/build_android_module_release.py --enforce-lockfile

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-${{ github.sha }}
          path: tools/release/dist/operit2-app-android-arm64-v8a-*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android module artifact
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-module-${{ github.sha }}
          path: tools/release/dist/operit2-module-android-arm64-v8a-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
